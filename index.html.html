<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏪 The Grand Store — Escape Game</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1976D2;--blue2:#42A5F5;--bl:#E3F2FD;
  --teal:#00897B;--teal2:#4DB6AC;--tl:#E0F2F1;
  --amber:#F9A825;--amber2:#FFD54F;--am:#FFF9C4;
  --red:#E53935;--green:#43A047;
  --bg:linear-gradient(135deg,#EBF5FB 0%,#E8F8F5 55%,#FFFDE7 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);min-height:100vh;background-attachment:fixed}
h1,h2,h3,.pop{font-family:'Poppins',sans-serif}
.page{max-width:800px;margin:0 auto;padding:16px 18px 40px}
.card{background:#fff;border-radius:18px;box-shadow:0 4px 22px rgba(25,118,210,.09);padding:24px;margin-bottom:14px}
.card-blue{border-top:4px solid var(--blue)}
.card-teal{border-top:4px solid var(--teal)}
.card-amber{border-top:4px solid var(--amber)}
/* ── Buttons ── */
.btn{border:none;cursor:pointer;font-family:'Inter',sans-serif;font-weight:700;border-radius:50px;padding:10px 22px;font-size:.88rem;display:inline-flex;align-items:center;gap:6px;transition:transform .12s,box-shadow .12s}
.btn:active{transform:scale(.96)!important}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 3px 0 #1248A0}
.btn-blue:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #1248A0}
.btn-teal{background:var(--teal);color:#fff;box-shadow:0 3px 0 #005046}
.btn-teal:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #005046}
.btn-amber{background:var(--amber);color:#333;box-shadow:0 3px 0 #B8780A}
.btn-amber:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #B8780A}
.btn-red{background:var(--red);color:#fff;box-shadow:0 3px 0 #9A1B1B}
.btn-red:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #9A1B1B}
.btn-green{background:var(--green);color:#fff;box-shadow:0 3px 0 #276227}
.btn-green:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #276227}
.btn-gray{background:#E0E0E0;color:#555}
.btn-gray:hover:not(:disabled){background:#D0D0D0}
.btn-outline{background:transparent;color:var(--blue);border:2px solid var(--blue)}
.btn-outline:hover:not(:disabled){background:var(--bl)}
.lg{font-size:1rem;padding:13px 30px}
.sm{font-size:.78rem;padding:6px 14px}
.full{width:100%;justify-content:center}
/* ── Header ── */
.hdr{background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:2px solid #E8F4FD;padding:10px 0;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(25,118,210,.08)}
.hdr-in{max-width:800px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:12px}
/* ── Progress ── */
.prg{display:flex;align-items:center;flex:1}
.prg-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.92rem;font-weight:800;transition:all .3s;flex-shrink:0}
.prg-done{background:var(--teal);color:#fff;box-shadow:0 0 0 3px #B2DFDB}
.prg-active{background:var(--amber);color:#333;box-shadow:0 0 0 3px #FFF9C4;animation:pls .8s ease-in-out infinite}
.prg-future{background:#E8E8E8;color:#BBB}
.prg-line{flex:1;height:3px;margin:0 2px;transition:background .3s}
.prg-lbl{font-size:.58rem;font-weight:700;color:#AAA;text-align:center;margin-top:2px}
/* ── Score pill ── */
.sc-pill{background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;padding:5px 15px;border-radius:50px;font-weight:800;font-size:.88rem;white-space:nowrap;box-shadow:0 3px 10px rgba(25,118,210,.25)}
/* ── Inputs ── */
input{font-family:'Inter',sans-serif;border:2px solid #E0E0E0;border-radius:11px;padding:10px 13px;font-size:.9rem;width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(25,118,210,.12)}
/* ── QCM ── */
.opt{display:flex;align-items:center;gap:9px;padding:11px 14px;border:2px solid #E8E8E8;border-radius:12px;margin-bottom:8px;cursor:pointer;font-weight:600;font-size:.88rem;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--blue2);background:var(--bl)}
.opt.sel{border-color:var(--blue);background:#EBF5FB}
.opt.right{border-color:var(--green);background:#EDF7EE}
.opt.wrong{border-color:var(--red);background:#FFEBEE}
.let{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;flex-shrink:0;transition:all .15s}
/* ── V/F ── */
.vfr{display:flex;align-items:center;gap:8px;padding:9px 12px;border:2px solid #E8E8E8;border-radius:12px;margin-bottom:7px;transition:all .15s;flex-wrap:wrap}
.tvf{padding:5px 13px;border-radius:50px;border:2px solid;cursor:pointer;font-weight:700;font-size:.79rem;transition:all .15s;font-family:'Inter',sans-serif}
/* ── Matching ── */
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mi{padding:9px 12px;border:2px solid #E8E8E8;border-radius:11px;cursor:pointer;font-weight:600;font-size:.83rem;min-height:50px;display:flex;align-items:center;transition:all .15s;line-height:1.35}
.mi:hover:not(.mu):not(.mok):not(.mko){border-color:#7E57C2;background:#F3E5F5}
.mi.msel{border-color:#7E57C2;background:#EDE7F6;box-shadow:0 0 0 3px rgba(126,87,194,.15)}
.mi.mu{opacity:.4;cursor:default;border-style:dashed}
.mi.mok{border-color:var(--green);background:#EDF7EE;opacity:1;cursor:default}
.mi.mko{border-color:var(--red);background:#FFEBEE;opacity:1;cursor:default}
/* ── Situation card ── */
.sit{background:linear-gradient(135deg,#EBF5FB,#E0F2F1);border:2px solid var(--teal);border-radius:16px;padding:18px}
.slbl{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--teal);margin-bottom:2px}
.sval{font-weight:600;font-size:.9rem;margin-bottom:12px;line-height:1.5}
.hint{background:var(--am);border:2px dashed var(--amber);border-radius:11px;padding:9px 13px;font-size:.83rem;font-weight:700;color:#7A5700}
/* ── Reading ── */
.rtxt{background:#F8FCFE;border-left:4px solid var(--blue2);padding:15px;border-radius:0 12px 12px 0;font-size:.87rem;line-height:1.8;margin-bottom:14px;color:#333}
/* ── Stars ── */
.stars{font-size:1.5rem;letter-spacing:2px;color:var(--amber)}
/* ── Indice box ── */
.ibx{background:linear-gradient(135deg,var(--blue),var(--teal));border-radius:20px;padding:26px;text-align:center}
.iwd{font-family:'Poppins',sans-serif;font-size:2.5rem;font-weight:900;color:#fff;letter-spacing:.06em;text-shadow:0 3px 0 rgba(0,0,0,.15)}
/* ── Banners ── */
.ok{background:#EDF7EE;border:2px solid var(--green);border-radius:12px;padding:11px;font-weight:700;color:#1B5E20;font-size:.88rem}
.ko{background:#FFEBEE;border:2px solid var(--red);border-radius:12px;padding:11px;font-weight:700;color:#7F0000;font-size:.88rem}
/* ── Modal ── */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.46);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.mbox{background:#fff;border-radius:20px;padding:26px;width:100%;max-width:400px;animation:pop .3s cubic-bezier(.17,.67,.35,1.4)}
/* ── Achievement overlay ── */
.achv{background:linear-gradient(135deg,var(--amber),#FF8F00);border-radius:16px;padding:16px 20px;text-align:center;margin-bottom:12px}
/* ── Animations ── */
@keyframes fadein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pls{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes scoreup{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.fadein{animation:fadein .32s ease-out}
.chip{background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;padding:3px 11px;border-radius:50px;font-weight:700;font-size:.78rem;display:inline-block;margin:2px}
@media(max-width:580px){.mg{grid-template-columns:1fr}.card{padding:17px}.iwd{font-size:1.85rem}.lg{font-size:.93rem;padding:11px 22px}}
@media print{.noprint{display:none!important}}
</style>
</head>

const ftm=(s,e)=>{if(!s||!e)return'—';const d=Math.round((e-s)/1e3);return`${0|d/60}min ${d%60}s`;};

function resumeGame(){

function newGame(){
  const name=(document.getElementById('gn')||{}).value||F.gn||'';
  if(!name.trim()){const e=document.getElementById('ge');if(e)e.textContent="Entrez le nom de l'équipe";return;}
  const n=S.np||1;const parts=[];
  for(let i=0;i<n;i++){const fn=(F['fn'+i]||'').toUpperCase().slice(0,2),ln=(F['ln'+i]||'').toUpperCase().slice(0,2);if(!fn||!ln){const e=document.getElementById('ge');if(e)e.textContent='Remplissez tous les participants';return;}parts.push({fn,ln});}
  clearProgress({n:name.trim(),p:parts});
  S.sh=shuf([0,1,2,3,4]);S.rv=[];S.res={};S.wr=[];S.pts=0;
  S.g={n:name.trim(),p:parts};S.t0=Date.now();S.t1=null;
  S.l2s1=null;S.l3i=0;S.l5i=0;F={};go('l1i');
}
function startGame(){
  const name=(document.getElementById('gn')||{}).value||F.gn||'';
  if(!name.trim()){const e=document.getElementById('ge');if(e)e.textContent="Entrez le nom de l'équipe";return;}
  const parts=[];
  for(let i=0;i<(S.np||1);i++){
    const fn=(F['fn'+i]||'').toUpperCase().slice(0,2);
    const ln=(F['ln'+i]||'').toUpperCase().slice(0,2);

  }
  clearProgress({n:name.trim(),p:parts});
  S.sh=shuf([0,1,2,3,4]);S.rv=[];S.res={};S.wr=[];S.pts=0;
  S.g={n:name.trim(),p:parts};S.t0=Date.now();S.t1=null;
  S.l2s1=null;S.l3i=0;S.l5i=0;F={};go('l1i');
}

/* ═══════════ QCM ═══════════ */
function vQCM(){
  const{qs,cur=0,ans={},done=false}=E;
  if(!qs)return'';
  const q=qs[cur];const L='ABCD';const CC=['var(--blue)','var(--teal)','var(--amber)','#7B1FA2'];
  const dots=qs.map((_,i)=>{const c=done?(ans[i]===qs[i].c?'var(--green)':'var(--red)'):(ans[i]!=null?'var(--blue)':'#DDD');return`<div onclick="E.cur=${i};render()" style="width:9px;height:9px;border-radius:50%;background:${c};cursor:pointer;display:inline-block;margin:2px"></div>`;}).join('');
  const opts=q.o.map((opt,oi)=>{
    let bc='#E8E8E8',bg='#fff';
    if(ans[cur]===oi){bc='var(--blue)';bg='#EBF5FB';}
    if(done&&oi===q.c){bc='var(--green)';bg='#EDF7EE';}
    if(done&&ans[cur]===oi&&oi!==q.c){bc='var(--red)';bg='#FFEBEE';}
    const lbg=ans[cur]===oi?CC[oi]:'#F0F0F0',lc=ans[cur]===oi?'#fff':'#999';
    const mk=done?(oi===q.c?' ✓':(ans[cur]===oi?' ✗':'')):'';
    return`<div class="opt ${ans[cur]===oi?'sel':''} ${done&&oi===q.c?'right':''} ${done&&ans[cur]===oi&&oi!==q.c?'wrong':''}" onclick="${done?'':(`E.ans[${cur}]=${oi};render()`)}" style="border-color:${bc};background:${bg}">
      <div class="let" style="background:${lbg};color:${lc}">${L[oi]}</div>
      <span style="flex:1">${opt}</span><span style="font-weight:800;color:${done&&oi===q.c?'var(--green)':'var(--red)'}">${mk}</span>
    </div>`;
  }).join('');
  const allA=Object.keys(ans).length===qs.length;
  const score=qs.filter((_,i)=>ans[i]===qs[i].c).length;
  const bot=done
    ?`<div style="display:flex;gap:10px;width:100%;align-items:center;flex-wrap:wrap;margin-top:4px">${achvBanner(score)}<div style="display:flex;gap:8px;width:100%"><div class="${pass(score)?'ok':'ko'}" style="flex:1;margin:0">${score}/${qs.length} ${pass(score)?'✓ Réussi':'✗ Insuffisant'}</div>${btn('Continuer →','qcmDone()','teal')}</div></div>`
    :(allA?btn('✅ Valider mes réponses','E.done=true;render()','blue'):`<small style="color:#CCC;font-size:.78rem">${Object.keys(ans).length}/${qs.length} répondues</small>`);
  return`<div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:11px">
      <span style="color:#AAA;font-size:.8rem;font-weight:700">Question ${cur+1} / ${qs.length}</span><div>${dots}</div>
    </div>
    <div style="background:#F0F7FF;border-radius:11px;padding:13px;margin-bottom:12px;font-weight:600;font-size:.9rem;line-height:1.5;color:#333">${q.q}</div>
    ${opts}
    <div style="display:flex;gap:8px;margin-top:12px;justify-content:space-between;align-items:center;flex-wrap:wrap">
      <div style="display:flex;gap:6px">
        ${cur>0?btn('← Préc.',`E.cur=${cur-1};render()`,'gray','sm'):''}
        ${cur<qs.length-1?btn('Suiv. →',`E.cur=${cur+1};render()`,'blue','sm'):''}
      </div>${bot}
    </div>
  </div>`;
}
function qcmDone(){
  const{qs,ans={},lbl=''}=E;
  const score=qs.filter((_,i)=>ans[i]===qs[i].c).length;
  const wrong=qs.flatMap((q,i)=>ans[i]!==q.c?[{level:lbl,question:q.q,given:ans[i]!=null?q.o[ans[i]]:'—',correct:q.o[q.c]}]:[]);
  S.wr.push(...wrong);
  S.allAns.push(...qs.map((q,i)=>({level:lbl,question:q.q,given:ans[i]!=null?q.o[ans[i]]:'—',correct:q.o[q.c],ok:ans[i]===q.c})));
  if(S.scr==='l1q1'){S.res['M1-Ex1']={score,passed:pass(score)};if(pass(score)){S.pts+=50;go('l1d');}else go('l1q2',{qs:Q2,cur:0,ans:{},done:false,lbl:'M1-Rattrapage'});}
  else if(S.scr==='l1q2'){S.res['M1-Ex2']={score,passed:pass(score)};if(pass(score))S.pts+=50;go('l1d');}
  else if(S.scr==='l2qm'){
    S.res['M2-QCM']={score,passed:pass(score)};
    if(pass(S.l2s1)&&pass(score)){S.pts+=100;go('l2d');}
    else{S.pts=Math.max(0,S.pts-25);go('l2fl');}
  }
}

/* ═══════════ V/F ═══════════ */
function vVF(){
  const{qs,text,ans={},done=false}=E;if(!qs)return'';
  const score=qs.filter((q,i)=>ans[i]===q.a).length;
  const rows=qs.map((q,i)=>{
    const bg=done?(ans[i]===q.a?'#EDF7EE':'#FFEBEE'):'#fff';
    const bc=done?(ans[i]===q.a?'var(--green)':'var(--red)'):'#E8E8E8';
    return`<div class="vfr" style="background:${bg};border-color:${bc}">
      <span style="width:21px;height:21px;background:var(--blue);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:#fff;flex-shrink:0">${i+1}</span>
      <span style="flex:1;font-weight:600;font-size:.86rem;line-height:1.4">${q.s}</span>
      <div style="display:flex;gap:5px;flex-shrink:0">
        <button class="tvf" onclick="${done?'':(`E.ans[${i}]=true;render()`)}" style="border-color:var(--green);color:${ans[i]===true?'#fff':'var(--green)'};background:${ans[i]===true?'var(--green)':'#fff'}">TRUE</button>
        <button class="tvf" onclick="${done?'':(`E.ans[${i}]=false;render()`)}" style="border-color:var(--red);color:${ans[i]===false?'#fff':'var(--red)'};background:${ans[i]===false?'var(--red)':'#fff'}">FALSE</button>
      </div>
      ${done?`<span style="font-weight:800;color:${ans[i]===q.a?'var(--green)':'var(--red)'}">${ans[i]===q.a?'✓':'✗'}</span>`:''}
    </div>`;
  }).join('');
  const allA=Object.keys(ans).length===qs.length;
  const bot=done
    ?`<div style="display:flex;gap:10px;width:100%;align-items:center;flex-wrap:wrap">${achvBanner(score)}<div style="display:flex;gap:8px;width:100%"><div class="${pass(score)?'ok':'ko'}" style="flex:1;margin:0">${score}/${qs.length} ${pass(score)?'✓ Réussi':'✗ Insuffisant'}</div>${btn('Continuer →','vfDone()','teal')}</div></div>`
    :btn('✅ Valider',`E.done=true;render()`,'blue','',!allA);
  return`<div class="rtxt"><strong style="color:var(--blue2);font-size:.8rem">📄 The Returns Desk</strong><br><br>${text.replace(/\n\n/g,'<br><br>')}</div>${rows}<div style="margin-top:12px;display:flex;justify-content:flex-end">${bot}</div>`;
}
function vfDone(){
  const{qs,ans={}}=E;
  const score=qs.filter((q,i)=>ans[i]===q.a).length;
  const wrong=qs.flatMap((q,i)=>ans[i]!==q.a?[{level:'M2-VF',question:q.s,given:ans[i]?'TRUE':'FALSE',correct:q.a?'TRUE':'FALSE'}]:[]);
  S.wr.push(...wrong);
  S.allAns.push(...qs.map((q,i)=>({level:'M2-VF',question:q.s,given:ans[i]===true?'TRUE':ans[i]===false?'FALSE':'—',correct:q.a?'TRUE':'FALSE',ok:ans[i]===q.a})));
  S.res['M2-VF']={score,passed:pass(score)};S.l2s1=score;
  go('l2qm',{qs:Q3,cur:0,ans:{},done:false,lbl:'M2-QCM'});
}

/* ═══════════ MATCHING ═══════════ */
function vMatch(){
  const{ps,sh,sel,mt={},done=false}=E;if(!ps)return'';
  const used=Object.values(mt);
  const words=ps.map((p,i)=>{
    const isM=mt[i]!=null,ok=done&&mt[i]===i,ko=done&&isM&&mt[i]!==i;
    return`<div class="mi${sel===i?' msel':''}${isM&&!done?' mu':''}${ok?' mok':''}${ko?' mko':''}" onclick="${done||isM?'':(`selW(${i})`)}" style="${ok?'border-color:var(--green)':ko?'border-color:var(--red)':sel===i?'border-color:#7B1FA2':''}">
      <strong style="flex:1">${p.w}</strong>
      ${isM&&!done?'<span style="color:#7B1FA2;font-size:.72rem">✓</span>':''}
      ${ok?'<span style="color:var(--green)">✓</span>':''}${ko?'<span style="color:var(--red)">✗</span>':''}
    </div>`;
  }).join('');
  const defs=sh.map(orig=>{
    const isU=used.includes(orig);
    const mKey=Object.keys(mt).find(k=>mt[k]===orig);
    const ok=done&&mKey!=null&&Number(mKey)===orig;
    const ko=done&&isU&&!ok;
    return`<div class="mi${isU&&!done?' mu':''}${ok?' mok':''}${ko?' mko':''}" onclick="${isU?'':(`selD(${orig})`)}" style="${ok?'border-color:var(--green)':ko?'border-color:var(--red)':''}">${ps[orig].d}</div>`;
  }).join('');
  const allM=Object.keys(mt).length===ps.length;
  const score=ps.filter((_,i)=>mt[i]===i).length;
  const bot=done
    ?`<div style="display:flex;gap:10px;width:100%;flex-wrap:wrap">${achvBanner(score)}<div style="display:flex;gap:8px;width:100%"><div class="${pass(score)?'ok':'ko'}" style="flex:1;margin:0">${score}/${ps.length} ${pass(score)?'✓ Réussi':'✗ Insuffisant'}</div>${btn('Continuer →','matchDone()','teal')}</div></div>`
    :(allM?btn('✅ Valider','E.done=true;render()','blue'):`<small style="color:#CCC;font-size:.78rem">${Object.keys(mt).length}/${ps.length} associés</small>`);
  return`<p style="color:#AAA;font-size:.8rem;margin-bottom:10px;font-weight:700">① Cliquez un terme → ② Cliquez sa définition</p>
  <div class="mg"><div><div style="font-weight:800;color:#7B1FA2;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Termes</div>${words}</div>
  <div><div style="font-weight:800;color:var(--amber);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Définitions</div>${defs}</div></div>
  <div style="margin-top:13px;display:flex;justify-content:flex-end">${bot}</div>`;
}
function selW(i){if(E.done||E.mt[i]!=null)return;E.sel=E.sel===i?null:i;render();}
function selD(orig){if(E.done||Object.values(E.mt||{}).includes(orig)||E.sel==null)return;if(!E.mt)E.mt={};E.mt[E.sel]=orig;E.sel=null;render();}
function matchDone(){
  const{ps,mt={},lbl=''}=E;
  const score=ps.filter((_,i)=>mt[i]===i).length;
  const wrong=ps.flatMap((p,i)=>mt[i]!==i?[{level:lbl,question:`Match: ${p.w}`,given:mt[i]!=null?ps[mt[i]]?.d:'—',correct:p.d}]:[]);
  S.wr.push(...wrong);
  S.allAns.push(...ps.map((p,i)=>({level:lbl,question:p.w,given:mt[i]!=null?ps[mt[i]]?.d:'—',correct:p.d,ok:mt[i]===i})));
  if(S.scr==='l4e1'){S.res['M4-Ex1']={score,passed:pass(score)};if(pass(score)){S.pts+=50;go('l4d');}else go('l4e2',{ps:M2,sh:shuf(M2.map((_,i)=>i)),sel:null,mt:{},done:false,lbl:'M4-Rattrapage'});}
  else{S.res['M4-Ex2']={score,passed:pass(score)};if(pass(score))S.pts+=50;go('l4d');}
}

function openPDF(){

  const pmax=350;
  const pct=Math.min(100,Math.round((S.pts/pmax)*100));
  const medal=pct>=85?'🥇':pct>=65?'🥈':pct>=45?'🥉':'🎯';
  const parts=(S.g.p||[]).map(p=>`<span style="background:var(--blue);color:#fff;padding:3px 9px;border-radius:50px;font-size:.79rem;font-weight:700;margin:2px;display:inline-block">${p.fn}-${p.ln}</span>`).join(' ');

  /* ── Point breakdown ── */
  const r=S.res;
  const pRows=[
    r['L1-Ex1']?{label:'M1 — Vocabulaire Ex.1',score:r['L1-Ex1'].score,passed:r['L1-Ex1'].passed,pts:r['L1-Ex1'].passed?50:0}:{},
    r['L1-Ex2']?{label:'M1 — Vocabulaire Rattrapage',score:r['L1-Ex2'].score,passed:r['L1-Ex2'].passed,pts:r['L1-Ex2'].passed?50:0}:null,
    r['L2-VF']?{label:'M2 — Lecture V/F',score:r['L2-VF'].score,passed:r['L2-VF'].passed,pts:null}:null,
    r['L2-QCM']?{label:'M2 — Lecture QCM',score:r['L2-QCM'].score,passed:r['L2-QCM'].passed,pts:(r['L2-VF']?.passed&&r['L2-QCM']?.passed)?100:-25}:null,
    r['L3-Oral']?{label:'M3 — Expression orale',score:null,oral:true,passed:r['L3-Oral'].passed,pts:r['L3-Oral'].passed?50:0}:null,
    r['L4-Ex1']?{label:'M4 — Correspondance Ex.1',score:r['L4-Ex1'].score,passed:r['L4-Ex1'].passed,pts:r['L4-Ex1'].passed?50:0}:null,
    r['L4-Ex2']?{label:'M4 — Correspondance Rattrapage',score:r['L4-Ex2'].score,passed:r['L4-Ex2'].passed,pts:r['L4-Ex2'].passed?50:0}:null,
    r['L5-Oral']?{label:'M5 — Compte rendu oral',score:null,oral:true,passed:r['L5-Oral'].passed,pts:r['L5-Oral'].passed?50:0}:null
  ].filter(Boolean).filter(x=>Object.keys(x).length);
  const ptTableRows=pRows.map(x=>{
    const scoreStr=x.score!=null?`${x.score}/10`:x.oral?'Oral':'—';
    const ptsStr=x.pts===null?'(inclus)':x.pts>0?`+${x.pts} pts`:x.pts<0?`${x.pts} pts pénalité`:'0 pt';
    const bg=x.pts===null?'#F9F9F9':x.pts>0?'#EDF9EF':x.pts<0?'#FFF0F0':'#FFF8EE';
    const sc=x.pts===null?'#888':x.pts>0?'#1A7A27':x.pts<0?'#9A1A1A':'#888';
    return `<tr style="background:${bg}">
      <td style="padding:8px 10px;font-size:.82rem;font-weight:700">${x.label}</td>
      <td style="padding:8px 10px;text-align:center;font-size:.82rem">${scoreStr}</td>
      <td style="padding:8px 10px;text-align:center"><span style="background:${x.passed?'#6BCB77':x.pts===null?'#888':'#FF6B6B'};color:#fff;padding:2px 8px;border-radius:4px;font-size:.72rem;font-weight:800">${x.passed?'✓ Réussi':x.pts===null?'—':'✗'}</span></td>
      <td style="padding:8px 10px;text-align:center;font-weight:800;color:${sc};font-size:.84rem">${ptsStr}</td>
    </tr>`;
  }).join('');

  /* ── Detailed answers ── */
  const allA=S.allAns||[];
  const byLvl={};
  allA.forEach(a=>{if(!byLvl[a.level])byLvl[a.level]=[];byLvl[a.level].push(a);});
  const LBL={'L1-Ex1':'Vocabulaire Ex.1','L1-Ex2':'Vocabulaire Rattrapage','L2-VF':'Lecture — Vrai/Faux','L2-QCM':'Lecture — QCM','L4-Ex1':'Correspondance Ex.1','L4-Ex2':'Correspondance Rattrapage'};
  const detHTML=Object.keys(LBL).map(k=>{
    const items=byLvl[k];
    if(!items||!items.length)return'';
    const rows=items.map((a,idx)=>`<tr style="background:${idx%2===0?'#FAFAFA':'#fff'}">
      <td style="padding:7px 10px;font-size:.8rem;color:#444">${a.question}</td>
      <td style="padding:7px 10px;font-size:.8rem;color:${a.ok?'#1A7A27':'#9A1A1A'};font-weight:${a.ok?'600':'700'}">${a.given||'—'}</td>
      <td style="padding:7px 10px;font-size:.8rem;color:#1A7A27;font-weight:600">${a.correct}</td>
      <td style="padding:7px 10px;text-align:center;font-size:1rem">${a.ok?'✅':'❌'}</td>
    </tr>`).join('');
    const ok=items.filter(a=>a.ok).length;
    return `<div style="margin-bottom:16px">
      <div style="font-weight:800;font-size:.82rem;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">📋 ${LBL[k]} — ${ok}/${items.length} correctes</div>
      <table style="width:100%;border-collapse:collapse;border:1px solid #EEE;border-radius:10px;overflow:hidden">
        <tr style="background:var(--blue)"><th style="padding:7px 10px;text-align:left;font-size:.77rem;color:#fff">Question</th><th style="padding:7px 10px;text-align:left;font-size:.77rem;color:#fff">Réponse donnée</th><th style="padding:7px 10px;text-align:left;font-size:.77rem;color:#fff">Réponse correcte</th><th style="padding:7px 10px;text-align:center;font-size:.77rem;color:#fff">✓/✗</th></tr>
        ${rows}
      </table>
    </div>`;
  }).join('');

  const html=`<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<title>Rapport — The Grand Store</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Nunito',sans-serif;background:#F8F8F8;padding:22px;color:#333;font-size:14px}
  @media print{body{background:#fff;padding:8px}.noprint{display:none!important}}
  .noprint{margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap}
  .bp{background:var(--blue);color:#fff;border:none;padding:9px 22px;border-radius:50px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;font-size:.87rem}
  .bc{background:#E0E0E0;color:#555;border:none;padding:9px 22px;border-radius:50px;font-weight:800;cursor:pointer;font-family:'Nunito',sans-serif;font-size:.87rem}
  .card{background:#fff;border-radius:13px;box-shadow:0 2px 10px rgba(0,0,0,.07);padding:16px;margin-bottom:12px}
  @page{margin:1.2cm}
</style></head><body>
<div style="max-width:800px;margin:0 auto">
<div class="noprint">
  <button class="bp" onclick="window.print()">🖨️ Imprimer / Enregistrer PDF</button>
  <button class="bc" onclick="window.close()">✕ Fermer</button>
</div>

<div style="background:linear-gradient(135deg,#FF6B6B,var(--blue),#4ECDC4);border-radius:16px;padding:24px;text-align:center;color:#fff;margin-bottom:13px;print-color-adjust:exact;-webkit-print-color-adjust:exact">
  <div style="font-size:2rem;margin-bottom:6px">🏪</div>
  <div style="font-weight:900;font-size:1.55rem;margin-bottom:4px">The Grand Store</div>
  <div style="opacity:.85;font-size:.85rem">English Escape Game — Bac Pro 1ère Commerce</div>
  <div style="opacity:.65;font-size:.76rem;margin-top:4px">${new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'})}</div>
</div>

<div class="card" style="display:flex;align-items:center;gap:13px;flex-wrap:wrap">
  <div style="font-size:1.8rem">👥</div>
  <div style="flex:1"><div style="font-weight:900;font-size:1rem">${S.g.n||'—'}</div><div style="margin-top:5px">${parts}</div></div>
  <div style="text-align:center;background:#F8F8F8;border-radius:10px;padding:10px 16px;border:1px solid #EEE">
    <div style="font-weight:900;font-size:1.85rem;color:var(--blue)">${S.pts}</div>
    <div style="color:#AAA;font-size:.74rem">pts · ${dur}</div>
  </div>
</div>

<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
    <div style="font-weight:800;font-size:.9rem">${medal} Score global</div>
    <div style="font-weight:800;font-size:1rem;color:var(--blue)">${pct}%</div>
  </div>
  <div style="background:#F0F0F0;border-radius:50px;height:10px;overflow:hidden;margin-bottom:4px;print-color-adjust:exact;-webkit-print-color-adjust:exact">
    <div style="height:100%;border-radius:50px;background:linear-gradient(135deg,#FF6B6B,var(--blue),#4ECDC4);width:${pct}%"></div>
  </div>
  <div style="display:flex;justify-content:space-between;font-size:.71rem;color:#AAA"><span>0</span><span>350 pts max</span></div>
</div>

<div class="card">
  <div style="font-weight:800;color:var(--blue);margin-bottom:10px;font-size:.88rem">⭐ Décompte des points</div>
  <table style="width:100%;border-collapse:collapse;border:1px solid #EEE;border-radius:10px;overflow:hidden">
    <tr style="background:var(--blue)"><th style="padding:8px 10px;text-align:left;font-size:.77rem;color:#fff">Mission / Exercice</th><th style="padding:8px 10px;text-align:center;font-size:.77rem;color:#fff">Score</th><th style="padding:8px 10px;text-align:center;font-size:.77rem;color:#fff">Résultat</th><th style="padding:8px 10px;text-align:center;font-size:.77rem;color:#fff">Points</th></tr>
    ${ptTableRows}
    <tr style="background:#333"><td colspan="3" style="padding:8px 10px;font-weight:800;font-size:.83rem;color:#fff">TOTAL</td><td style="padding:8px 10px;text-align:center;font-weight:900;font-size:.95rem;color:#FFD93D">${S.pts} / 350 pts</td></tr>
  </table>
</div>

<div class="card">
  <div style="font-weight:800;color:var(--blue);margin-bottom:11px;font-size:.88rem">📋 Résultats détaillés — réponses et corrections</div>
  ${detHTML||'<p style="color:#888;font-size:.85rem;font-style:italic">Aucune donnée de réponse enregistrée.</p>'}
</div>

<div style="background:linear-gradient(135deg,#FF6B6B,var(--blue),#4ECDC4);border-radius:13px;padding:12px 20px;text-align:center;font-weight:900;font-size:1.15rem;color:#fff;margin-bottom:12px;letter-spacing:.03em;print-color-adjust:exact;-webkit-print-color-adjust:exact">
  ✅ THE CUSTOMER IS ALWAYS RIGHT
</div>
<div style="text-align:center;color:#BBB;font-size:.72rem">Créé par C. iemfre · Bac Pro 1ère Commerce · The Grand Store</div>
</div>
<script>window.onload=()=>setTimeout(()=>window.print(),700);<\/script>
</body></html>`;

  const w=window.open('','_blank');
  if(w){w.document.write(html);w.document.close();}
  else{alert('⚠️ Autorisez les pop-ups pour générer le PDF.');}
}

/* ═══════════ RGPD ═══════════ */
function vRGPD(){
  return`<div style="min-height:100vh;padding:20px 18px 40px">
  <div style="max-width:580px;margin:0 auto">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;padding-top:8px">
      <span style="color:#AAA;cursor:pointer;font-size:.83rem;font-weight:700" onclick="go('home')">← Retour</span>
    </div>
    <div style="background:linear-gradient(135deg,var(--blue),var(--teal));border-radius:16px;padding:26px;text-align:center;color:#fff;margin-bottom:18px;print-color-adjust:exact;-webkit-print-color-adjust:exact">
      <div style="font-size:2.4rem;margin-bottom:8px">🔒</div>
      <h1 class="pop" style="font-size:1.55rem;margin-bottom:4px">Protection des données personnelles</h1>
      <p style="opacity:.75;font-size:.82rem">The Grand Store — English Escape Game</p>
    </div>
    <div class="card" style="border-left:4px solid var(--teal);margin-bottom:10px">
      <p style="color:#333;font-size:.9rem;line-height:1.82">Cette application est un outil pédagogique développé pour un usage en classe.</p>
    </div>
    <div style="display:grid;gap:9px;margin-bottom:18px">
      <div class="card" style="padding:15px 16px">
        <p style="color:#333;font-size:.88rem;line-height:1.82">Aucune donnée n'est transmise à un serveur externe : toutes les informations (identifiant, réponses, score) restent uniquement dans la mémoire de votre navigateur, le temps de la partie en cours.</p>
      </div>
      <div class="card" style="padding:15px 16px">
        <p style="color:#333;font-size:.88rem;line-height:1.82">Aucun cookie tiers, aucun traceur publicitaire, aucun appel à une API externe n'est utilisé.</p>
      </div>
      <div class="card" style="padding:15px 16px">
        <p style="color:#333;font-size:.88rem;line-height:1.82">Les seules données saisies sont : les deux premières lettres de votre prénom et de votre nom (utilisées uniquement pour générer un identifiant au format XX-YY, sans jamais collecter votre identité complète), ainsi que vos réponses aux exercices.</p>
      </div>
      <div class="card" style="padding:15px 16px">
        <p style="color:#333;font-size:.88rem;line-height:1.82">Ces données sont sauvegardées localement sur votre appareil (via le stockage local du navigateur) afin de permettre la reprise de la progression entre plusieurs séances, sur le même appareil. Elles ne sont accessibles que depuis le navigateur utilisé et ne sont jamais transmises à un tiers. Vous pouvez les effacer à tout moment en vidant le cache de votre navigateur ou en démarrant une nouvelle partie.</p>
      </div>
      <div class="card" style="padding:15px 16px">
        <p style="color:#333;font-size:.88rem;line-height:1.82">Le PDF généré est créé localement dans votre navigateur ; il n'est envoyé à personne automatiquement. C'est à vous de le transmettre à votre professeur.</p>

}

/* ═══════════ ROUTER ═══════════ */
function go(scr,ei={}){E=ei;S.scr=scr;saveProgress();render();window.scrollTo(0,0);}
function render(){document.getElementById('app').innerHTML=view();}
function view(){
  const sc=S.scr;
  if(sc==='home')return vHome();
  if(sc==='rules')return vRules();
  if(sc==='rgpd')return vRGPD();
  if(sc==='tlg')return vLogin('Interface Professeur','tdb');
  if(sc==='tdb')return vTeacher();
  if(sc==='slg')return vLogin('Connexion Équipe','grp');
  if(sc==='grp')return vGroup();

  const W=hdr;
  if(sc==='l1i')return W(1)+`<div class="page">${lvlIntro('📋','Mission 1 — Induction Room','Vocabulaire commercial','<p style="font-weight:700;margin-bottom:7px">Welcome to The Grand Store!</p><p style="font-size:.88rem;color:#555;line-height:1.7">Avant d\'accéder au shop floor, prouvez que vous maîtrisez le vocabulaire commercial essentiel. 10 questions. Seuil de réussite : ≥ 8/10.</p>',"go('l1q1',{qs:Q1,cur:0,ans:{},done:false,lbl:'M1-Ex1'})",'blue')}</div>`;
  if(sc==='l1q1')return W(1)+`<div class="page"><div class="card card-blue"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><span style="background:var(--blue);color:#fff;padding:3px 12px;border-radius:50px;font-weight:800;font-size:.8rem">Ex. 1</span><strong style="font-size:.95rem">QCM — Vocabulaire</strong></div>${vQCM()}</div></div>`;
  if(sc==='l1q2')return W(1)+`<div class="page"><div class="ko" style="margin-bottom:12px">💪 Score insuffisant — exercice de rattrapage !</div><div class="card card-amber"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><span style="background:var(--amber);color:#333;padding:3px 12px;border-radius:50px;font-weight:800;font-size:.8rem">Rattrapage</span><strong style="font-size:.95rem">QCM — Vocabulaire (2)</strong></div>${vQCM()}</div></div>`;
  if(sc==='l1d')return W(1)+`<div class="page">${indiceScreen(0,"go('l2i')")}</div>`;

  if(sc==='l2i')return W(2)+`<div class="page">${lvlIntro('🔍','Mission 2 — Intelligence Desk','Compréhension écrite','<p style="font-weight:700;margin-bottom:7px">A file has been recovered!</p><p style="font-size:.88rem;color:#555;line-height:1.7">Deux textes professionnels, deux exercices <strong>obligatoires</strong>. ≥ 8/10 aux deux pour avancer.</p><p style="color:var(--red);font-weight:700;font-size:.84rem;margin-top:8px">⚠️ Échec sur l\'un des deux = −25 pts + retour Mission 1</p>',"go('l2vf',{qs:VF,text:T1,ans:{},done:false})",'teal')}</div>`;
  if(sc==='l2vf')return W(2)+`<div class="page"><div class="card card-teal"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><span style="background:var(--teal);color:#fff;padding:3px 12px;border-radius:50px;font-weight:800;font-size:.8rem">Ex. 1 / 2</span><strong style="font-size:.95rem">Vrai / Faux</strong></div>${vVF()}</div></div>`;
  if(sc==='l2qm')return W(2)+`<div class="page"><div class="card card-teal"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><span style="background:var(--teal);color:#fff;padding:3px 12px;border-radius:50px;font-weight:800;font-size:.8rem">Ex. 2 / 2</span><strong style="font-size:.95rem">QCM — The Weekly Briefing</strong></div><div class="rtxt"><strong style="color:var(--blue2);font-size:.8rem">📄 The Weekly Briefing</strong><br><br>${T2.replace(/\n\n/g,'<br><br>')}</div>${vQCM()}</div></div>`;
  if(sc==='l2fl')return W(2)+`<div class="page"><div class="card" style="text-align:center;padding:32px 20px"><div style="font-size:2.5rem;margin-bottom:8px">😓</div><h2 class="pop" style="color:var(--red);margin-bottom:10px">Score insuffisant</h2><p style="color:#666;margin-bottom:14px;font-size:.9rem">≥ 80% requis aux deux exercices pour passer à la Mission 3.</p><div class="ko" style="margin-bottom:22px">−25 points appliqués • Retour Mission 1</div>${btn('🔄 Retour Mission 1',"go('l1i')",'red','lg')}</div></div>`;
  if(sc==='l2d')return W(2)+`<div class="page">${indiceScreen(1,"go('l3i')")}</div>`;

  if(sc==='l3i')return W(3)+`<div class="page">${lvlIntro('🎤','Mission 3 — Situation Room','Expression orale','<p style="font-weight:700;margin-bottom:7px">A live customer situation!</p><p style="font-size:.88rem;color:#555;line-height:1.7">Un membre de l\'équipe est tiré au sort. Il lit la carte de situation et gère l\'interaction en anglais. No notes, no preparation — improvisation professionnelle !</p>',"go('l3or',{step:'card'});S.l3i=0",'blue')}</div>`;
  if(sc==='l3or')return W(3)+`<div class="page">${vOral(SIT[S.l3i||0])}</div>`;
  if(sc==='l3d')return W(3)+`<div class="page">${indiceScreen(2,"go('l4i')")}</div>`;

  if(sc==='l4i')return W(4)+`<div class="page">${lvlIntro('📌','Mission 4 — The Briefing Room','Correspondance commerciale','<p style="font-weight:700;margin-bottom:7px">The briefing files are scrambled!</p><p style="font-size:.88rem;color:#555;line-height:1.7">Associez chaque terme commercial à sa définition exacte. ⏱ 6 minutes recommandées. Seuil : ≥ 8/10.</p>',"go('l4e1',{ps:M1,sh:shuf(M1.map((_,i)=>i)),sel:null,mt:{},done:false,lbl:'M4-Ex1'})",'blue')}</div>`;
  if(sc==='l4e1')return W(4)+`<div class="page"><div class="card card-blue"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><span style="background:#7B1FA2;color:#fff;padding:3px 12px;border-radius:50px;font-weight:800;font-size:.8rem">Ex. 1</span><strong style="font-size:.95rem">Correspondance — Série A</strong></div>${vMatch()}</div></div>`;
  if(sc==='l4e2')return W(4)+`<div class="page"><div class="ko" style="margin-bottom:12px">💪 Rattrapage — nouvelle série !</div><div class="card card-amber"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><span style="background:var(--amber);color:#333;padding:3px 12px;border-radius:50px;font-weight:800;font-size:.8rem">Rattrapage</span><strong style="font-size:.95rem">Correspondance — Série B</strong></div>${vMatch()}</div></div>`;
  if(sc==='l4d')return W(4)+`<div class="page">${indiceScreen(3,"go('l5i')")}</div>`;

  if(sc==='l5i')return W(5)+`<div class="page">${lvlIntro('📊',"Mission 5 — The Manager's Office",'Compte rendu oral','<p style="font-weight:700;margin-bottom:7px">Final mission — the manager needs your report!</p><p style="font-size:.88rem;color:#555;line-height:1.7">Lisez la fiche d\'incident et présentez un compte rendu structuré en anglais. Langage professionnel exigé.</p>',"go('l5or',{step:'card'});S.l5i=0",'teal')}</div>`;
  if(sc==='l5or')return W(5)+`<div class="page">${vOral(REP[S.l5i||0],true)}</div>`;
  if(sc==='l5d')return W(5)+`<div class="page">${indiceScreen(4,"go('fin')")}</div>`;

  if(sc==='fin')return W(5)+`<div class="page">${vFinal()}</div>`;
  if(sc==='vic')return W(5)+`<div class="page">${vVictory()}</div>`;
  if(sc==='rep')return vReport();
  return'<p>Écran inconnu</p>';
}
render();
</script></body></html>
