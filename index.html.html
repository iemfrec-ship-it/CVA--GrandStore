<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛒 The Grand Store — Escape Game</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#1976D2;--teal2:#64B5F6;--tl:#E3F2FD;
  --coral:#00897B;--coral2:#4DB6AC;--cl:#E0F2F1;
  --amber:#F9A825;--amber2:#FFD98C;--am:#FFF6E0;
  --red:#E53935;--green:#43A047;
  --ink:#22303B;
  --bg:linear-gradient(135deg,#EBF5FB,#E8F8F5,#FFFDE7);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);min-height:100vh;background-attachment:fixed;color:var(--ink)}
h1,h2,h3,.pop{font-family:'Poppins',sans-serif}
.page{max-width:800px;margin:0 auto;padding:16px 18px 40px}
.card{background:#fff;border-radius:18px;box-shadow:0 4px 22px rgba(25,118,210,.10);padding:24px;margin-bottom:14px}
.card-teal{border-top:4px solid var(--teal)}
.card-coral{border-top:4px solid var(--coral)}
.card-amber{border-top:4px solid var(--amber)}
/* ── Glass pane pattern (skylight / verrière) ── */
.glass{position:relative;overflow:hidden}
.glass::before{content:'';position:absolute;inset:0;opacity:.14;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,#fff 0 2px,transparent 2px 42px),repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 42px);}
/* ── Buttons ── */
.btn{border:none;cursor:pointer;font-family:'Inter',sans-serif;font-weight:700;border-radius:50px;padding:10px 22px;font-size:.88rem;display:inline-flex;align-items:center;gap:6px;transition:transform .12s,box-shadow .12s}
.btn:active{transform:scale(.96)!important}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.btn-teal{background:var(--teal);color:#fff;box-shadow:0 3px 0 #0D47A1}
.btn-teal:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #0D47A1}
.btn-coral{background:var(--coral);color:#fff;box-shadow:0 3px 0 #00695C}
.btn-coral:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #00695C}
.btn-amber{background:var(--amber);color:#3A2900;box-shadow:0 3px 0 #B87A0A}
.btn-amber:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #B87A0A}
.btn-red{background:var(--red);color:#fff;box-shadow:0 3px 0 #9A1B1B}
.btn-red:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #9A1B1B}
.btn-green{background:var(--green);color:#fff;box-shadow:0 3px 0 #276227}
.btn-green:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 #276227}
.btn-gray{background:#E4E4E4;color:#555}
.btn-gray:hover:not(:disabled){background:#D3D3D3}
.btn-outline{background:transparent;color:var(--teal);border:2px solid var(--teal)}
.btn-outline:hover:not(:disabled){background:var(--tl)}
.lg{font-size:1rem;padding:13px 30px}
.sm{font-size:.78rem;padding:6px 14px}
.full{width:100%;justify-content:center}
/* ── Header ── */
.hdr{background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:2px solid #DCEBFA;padding:10px 0;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(25,118,210,.10)}
.hdr-in{max-width:800px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:12px}
/* ── Progress ── */
.prg{display:flex;align-items:center;flex:1}
.prg-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.92rem;font-weight:800;transition:all .3s;flex-shrink:0}
.prg-done{background:var(--teal);color:#fff;box-shadow:0 0 0 3px #BBDEFB}
.prg-active{background:var(--coral);color:#fff;box-shadow:0 0 0 3px #B2DFDB;animation:pls .8s ease-in-out infinite}
.prg-future{background:#EDEDED;color:#BBB}
.prg-line{flex:1;height:3px;margin:0 2px;transition:background .3s}
.prg-lbl{font-size:.52rem;font-weight:700;color:#AAA;text-align:center;margin-top:2px;max-width:52px;line-height:1.15}
/* ── Score pill ── */
.sc-pill{background:linear-gradient(135deg,var(--teal),var(--coral));color:#fff;padding:5px 15px;border-radius:50px;font-weight:800;font-size:.88rem;white-space:nowrap;box-shadow:0 3px 10px rgba(25,118,210,.25)}
.score-fab{position:fixed;top:12px;right:14px;z-index:45;background:linear-gradient(135deg,var(--teal),var(--coral));color:#fff;padding:7px 17px;border-radius:50px;font-weight:800;font-size:.9rem;box-shadow:0 3px 12px rgba(25,118,210,.35);white-space:nowrap}
/* ── Persistent teacher button ── */
.prof-fab{position:fixed;bottom:16px;right:16px;z-index:40}
.rep-fab{position:fixed;bottom:16px;left:16px;z-index:40}
/* ── Inputs ── */
input,textarea{font-family:'Inter',sans-serif;border:2px solid #E0E0E0;border-radius:11px;padding:10px 13px;font-size:.9rem;width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(25,118,210,.12)}
textarea{resize:vertical;font-family:'Inter',sans-serif;line-height:1.6}
/* ── QCM ── */
.opt{display:flex;align-items:center;gap:9px;padding:11px 14px;border:2px solid #E8E8E8;border-radius:12px;margin-bottom:8px;cursor:pointer;font-weight:600;font-size:.88rem;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--teal2);background:var(--tl)}
.opt.sel{border-color:var(--teal);background:#E9F8F6}
.opt.right{border-color:var(--green);background:#EDF7EE}
.opt.wrong{border-color:var(--red);background:#FFEBEE}
.let{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;flex-shrink:0;transition:all .15s}
/* ── V/F ── */
.vfr{display:flex;align-items:center;gap:8px;padding:9px 12px;border:2px solid #E8E8E8;border-radius:12px;margin-bottom:7px;transition:all .15s;flex-wrap:wrap}
.tvf{padding:5px 13px;border-radius:50px;border:2px solid;cursor:pointer;font-weight:700;font-size:.79rem;transition:all .15s;font-family:'Inter',sans-serif}
/* ── Matching ── */
.mg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mi{padding:9px 12px;border:2px solid #E8E8E8;border-radius:11px;cursor:pointer;font-weight:600;font-size:.83rem;min-height:50px;display:flex;align-items:center;transition:all .15s;line-height:1.35}
.mi:hover:not(.mu):not(.mok):not(.mko){border-color:var(--coral);background:var(--cl)}
.mi.msel{border-color:var(--coral);background:#FFE3DB;box-shadow:0 0 0 3px rgba(255,111,89,.18)}
.mi.mu{opacity:.4;cursor:default;border-style:dashed}
.mi.mok{border-color:var(--green);background:#EDF7EE;opacity:1;cursor:default}
.mi.mko{border-color:var(--red);background:#FFEBEE;opacity:1;cursor:default}
/* ── Situation card ── */
.sit{background:linear-gradient(135deg,var(--tl),var(--cl));border:2px solid var(--teal);border-radius:16px;padding:18px}
.slbl{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--teal);margin-bottom:2px}
.sval{font-weight:600;font-size:.9rem;margin-bottom:12px;line-height:1.5}
.hint{background:var(--am);border:2px dashed var(--amber);border-radius:11px;padding:9px 13px;font-size:.83rem;font-weight:700;color:#7A5700}
/* ── Reading ── */
.rtxt{background:#F8FDFC;border-left:4px solid var(--teal2);padding:15px;border-radius:0 12px 12px 0;font-size:.87rem;line-height:1.8;margin-bottom:14px;color:#333}
/* ── Stars ── */
.stars{font-size:1.5rem;letter-spacing:2px;color:var(--amber)}
/* ── Indice box ── */
.ibx{background:linear-gradient(135deg,var(--teal),var(--coral));border-radius:20px;padding:26px;text-align:center}
.iwd{font-family:'Poppins',sans-serif;font-size:2.5rem;font-weight:900;color:#fff;letter-spacing:.06em;text-shadow:0 3px 0 rgba(0,0,0,.15)}
/* ── Banners ── */
.ok{background:#EDF7EE;border:2px solid var(--green);border-radius:12px;padding:11px;font-weight:700;color:#1B5E20;font-size:.88rem}
.ko{background:#FFF3E9;border:2px solid var(--amber);border-radius:12px;padding:11px;font-weight:700;color:#7A5700;font-size:.88rem}
.err{background:#FFEBEE;border:2px solid var(--red);border-radius:12px;padding:11px;font-weight:700;color:#7F0000;font-size:.88rem}
/* ── Achievement overlay ── */
.achv{background:linear-gradient(135deg,var(--amber),#FF8F00);border-radius:16px;padding:16px 20px;text-align:center;margin-bottom:12px}
/* ── Animations ── */
@keyframes fadein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pls{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.fadein{animation:fadein .32s ease-out}
.chip{background:linear-gradient(135deg,var(--teal),var(--coral));color:#fff;padding:3px 11px;border-radius:50px;font-weight:700;font-size:.78rem;display:inline-block;margin:2px}
@media(max-width:580px){.mg{grid-template-columns:1fr}.card{padding:17px}.iwd{font-size:1.85rem}.lg{font-size:.93rem;padding:11px 22px}}
@media print{.noprint{display:none!important}}
</style>
</head>

  text:`It was 8:45 a.m. when Léa arrived at the international exhibition centre. The doors were due to open in fifteen minutes, and the reception desk was already busy. A tall man in a grey suit approached her, looking anxious. He introduced himself as Mr. Alvarez, a VIP guest from the Spanish delegation, and explained that his accreditation badge had not arrived by post as promised.

/* Build a QCM set from a vocabulary pool subset (fresh distractors each time) */
function buildQCMSet(items){
  return items.map((item,idx)=>{
    const others=items.filter((_,j)=>j!==idx);
    const distractors=shuf(others).slice(0,3).map(x=>x.d);
    const opts=shuf([item.d,...distractors]);
    return{q:`What does "${item.w}" mean?`,o:opts,c:opts.indexOf(item.d)};
  });
}

function startWritten(mission,kind){
  goWrittenAttempt(mission,kind,(S.att[mission]||1)-1);
}
function goWrittenAttempt(mission,kind,attIdx,banner){
  if(kind==='qcm'){
    const qs=buildQCMSet(S.sets1[attIdx]);
    go('wex',{mission,kind,qs,cur:0,ans:{},done:false,_banner:banner});
  }else if(kind==='vf'){
    const set=M2SETS[attIdx];
    go('wex',{mission,kind,qs:set.vf,text:set.text,title:set.title,cur:0,ans:{},done:false,_banner:banner});
  }else if(kind==='match'){
    const ps=(mission==='m5'?S.sets5:S.sets4)[attIdx];
    go('wex',{mission,kind,ps,sh:shuf(ps.map((_,i)=>i)),sel:null,mt:{},done:false,_banner:banner});
  }
}
function resolveWritten(mission,kind,score,total,wrongItems){
  const att=S.att[mission];
  let passed,ptsDelta;
  if(att===1){passed=score>=Math.ceil(total*0.8);ptsDelta=passed?50:-10;}
  else if(att===2&&mission!=='m5'){passed=score>=Math.ceil(total*0.7);ptsDelta=passed?30:-15;}
  else{passed=score>=Math.ceil(total*0.5);ptsDelta=Math.round(score/total*20);}
  S.pts=S.pts+ptsDelta;
  S.res[mission+'-t'+att]={score,total,success:passed,pts:ptsDelta};
  if(!passed)S.wr.push(...wrongItems);
  if(passed||att===3||(mission==='m5'&&att===2)){
    goMissionDone(mission);
  }else{
    S.att[mission]=att+1;
    const label=kind==='vf'?'texte':'lot de mots';
    goWrittenAttempt(mission,kind,att); // att is now new attempt-1 index (0-based)
  }
}
function goMissionDone(mission){
  if(mission==='m1')go('m1d');
  else if(mission==='m2')go('m2d');
  else if(mission==='m4')go('m4d');
  else if(mission==='m5')go('m5d');
}

/* ── QCM renderer ── */
function vQCM(){
  const{qs,cur=0,ans={},done=false}=E;
  if(!qs)return'';
  const q=qs[cur];const L='ABCD';const CC=['var(--teal)','var(--coral)','var(--amber)','#7B1FA2'];
  const dots=qs.map((_,i)=>{const c=done?(ans[i]===qs[i].c?'var(--green)':'var(--red)'):(ans[i]!=null?'var(--teal)':'#DDD');return`<div onclick="E.cur=${i};render()" style="width:9px;height:9px;border-radius:50%;background:${c};cursor:pointer;display:inline-block;margin:2px"></div>`;}).join('');
  const opts=q.o.map((opt,oi)=>{
    let bc='#E8E8E8',bg='#fff';
    if(ans[cur]===oi){bc='var(--teal)';bg='#E9F8F6';}
    if(done&&oi===q.c){bc='var(--green)';bg='#EDF7EE';}
    if(done&&ans[cur]===oi&&oi!==q.c){bc='var(--red)';bg='#FFEBEE';}
    const lbg=ans[cur]===oi?CC[oi]:'#F0F0F0',lc=ans[cur]===oi?'#fff':'#999';
    const mk=done?(oi===q.c?' ✓':(ans[cur]===oi?' ✗':'')):'';
    return`<div class="opt ${ans[cur]===oi?'sel':''} ${done&&oi===q.c?'right':''} ${done&&ans[cur]===oi&&oi!==q.c?'wrong':''}" onclick="${done?'':(`E.ans[${cur}]=${oi};render()`)}" style="border-color:${bc};background:${bg}">
      <div class="let" style="background:${lbg};color:${lc}">${L[oi]}</div>
      <span style="flex:1">${opt}</span><span style="font-weight:800;color:${done&&oi===q.c?'var(--green)':'var(--red)'}">${mk}</span>
    </div>`;
  }).join('');
  const allA=Object.keys(ans).length===qs.length;
  const score=qs.filter((_,i)=>ans[i]===qs[i].c).length;
  const bot=done
    ?`<div style="display:flex;gap:8px;width:100%;margin-top:4px"><div class="ok" style="flex:1;margin:0">${score}/${qs.length} bonnes réponses</div>${btn('Continuer →','wexDone()','coral')}</div>`
    :(allA?btn('✅ Valider mes réponses','E.done=true;render()','teal'):`<small style="color:#CCC;font-size:.78rem">${Object.keys(ans).length}/${qs.length} répondues</small>`);
  return`<div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:11px">
      <span style="color:#AAA;font-size:.8rem;font-weight:700">Question ${cur+1} / ${qs.length}</span><div>${dots}</div>
    </div>
    <div style="background:var(--tl);border-radius:11px;padding:13px;margin-bottom:12px;font-weight:600;font-size:.9rem;line-height:1.5;color:#333">${q.q}</div>
    ${opts}
    <div style="display:flex;gap:8px;margin-top:12px;justify-content:space-between;align-items:center;flex-wrap:wrap">
      <div style="display:flex;gap:6px">
        ${cur>0?btn('← Préc.',`E.cur=${cur-1};render()`,'gray','sm'):''}
        ${cur<qs.length-1?btn('Suiv. →',`E.cur=${cur+1};render()`,'teal','sm'):''}
      </div>${bot}
    </div>
  </div>`;
}
/* ── V/F renderer ── */
function vVF(){
  const{qs,text,title,ans={},done=false}=E;if(!qs)return'';
  const score=qs.filter((q,i)=>ans[i]===q.a).length;
  const rows=qs.map((q,i)=>{

        <button class="tvf" onclick="${done?'':(`E.ans[${i}]=false;render()`)}" style="border-color:var(--red);color:${ans[i]===false?'#fff':'var(--red)'};background:${ans[i]===false?'var(--red)':'#fff'}">FAUX</button>
      </div>
      ${done?`<span style="font-weight:800;color:${ans[i]===q.a?'var(--green)':'var(--red)'}">${ans[i]===q.a?'✓':'✗'}</span>`:''}
    </div>`;
  }).join('');
  const allA=Object.keys(ans).length===qs.length;
  const bot=done
    ?`<div style="display:flex;gap:8px;width:100%"><div class="ok" style="flex:1;margin:0">${score}/${qs.length} bonnes réponses</div>${btn('Continuer →','wexDone()','coral')}</div>`
    :btn('✅ Valider',`E.done=true;render()`,'teal','',!allA);
  return`<div class="rtxt"><strong style="color:var(--teal2);font-size:.8rem">📄 ${title}</strong><br><br>${text.replace(/\n\n/g,'<br><br>')}</div>${rows}<div style="margin-top:12px;display:flex;justify-content:flex-end">${bot}</div>`;
}
/* ── Matching renderer ── */
function vMatch(){
  const{ps,sh,sel,mt={},done=false}=E;if(!ps)return'';
  const used=Object.values(mt);
  const words=ps.map((p,i)=>{
    const isM=mt[i]!=null,ok=done&&mt[i]===i,ko=done&&isM&&mt[i]!==i;
    return`<div class="mi${sel===i?' msel':''}${isM&&!done?' mu':''}${ok?' mok':''}${ko?' mko':''}" onclick="${done||isM?'':(`selW(${i})`)}">
      <strong style="flex:1">${p.w}</strong>
      ${isM&&!done?'<span style="color:var(--coral);font-size:.72rem">✓</span>':''}
      ${ok?'<span style="color:var(--green)">✓</span>':''}${ko?'<span style="color:var(--red)">✗</span>':''}
    </div>`;
  }).join('');
  const defs=sh.map(orig=>{
    const isU=used.includes(orig);
    const mKey=Object.keys(mt).find(k=>mt[k]===orig);
    const ok=done&&mKey!=null&&Number(mKey)===orig;
    const ko=done&&isU&&!ok;
    return`<div class="mi${isU&&!done?' mu':''}${ok?' mok':''}${ko?' mko':''}" onclick="${isU?'':(`selD(${orig})`)}">${ps[orig].d}</div>`;
  }).join('');
  const allM=Object.keys(mt).length===ps.length;
  const score=ps.filter((_,i)=>mt[i]===i).length;
  const bot=done
    ?`<div style="display:flex;gap:8px;width:100%"><div class="ok" style="flex:1;margin:0">${score}/${ps.length} bonnes réponses</div>${btn('Continuer →','wexDone()','coral')}</div>`
    :(allM?btn('✅ Valider','E.done=true;render()','teal'):`<small style="color:#CCC;font-size:.78rem">${Object.keys(mt).length}/${ps.length} associés</small>`);
  return`<div class="hint" style="margin-bottom:12px">⚠️ Aucun retour en arrière possible : lisez bien avant de valider chaque association !</div><p style="color:#AAA;font-size:.8rem;margin-bottom:10px;font-weight:700">① Cliquez un terme → ② Cliquez sa définition</p>
  <div class="mg"><div><div style="font-weight:800;color:var(--coral);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">${E.mission==='m5'?'Français':'English'}</div>${words}</div>
  <div><div style="font-weight:800;color:var(--amber);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">${E.mission==='m5'?'English':'Français'}</div>${defs}</div></div>
  <div style="margin-top:13px;display:flex;justify-content:flex-end">${bot}</div>`;
}
function selW(i){if(E.done||E.mt[i]!=null)return;E.sel=E.sel===i?null:i;render();}
function selD(orig){if(E.done||Object.values(E.mt||{}).includes(orig)||E.sel==null)return;if(!E.mt)E.mt={};E.mt[E.sel]=orig;E.sel=null;render();}

function wexDone(){
  const{mission,kind,qs,ps,ans={},mt={}}=E;
  if(kind==='qcm'){
    const score=qs.filter((_,i)=>ans[i]===qs[i].c).length;
    const wrong=qs.flatMap((q,i)=>ans[i]!==q.c?[{level:'M1',question:q.q,given:ans[i]!=null?q.o[ans[i]]:'—',correct:q.o[q.c]}]:[]);
    resolveWritten(mission,kind,score,qs.length,wrong);
  }else if(kind==='vf'){
    const score=qs.filter((q,i)=>ans[i]===q.a).length;
    const wrong=qs.flatMap((q,i)=>ans[i]!==q.a?[{level:'M2',question:q.s,given:ans[i]?'VRAI':'FAUX',correct:q.a?'VRAI':'FAUX'}]:[]);
    resolveWritten(mission,kind,score,qs.length,wrong);
  }else if(kind==='match'){
    const score=ps.filter((_,i)=>mt[i]===i).length;
    const wrong=ps.flatMap((p,i)=>mt[i]!==i?[{level:mission.toUpperCase(),question:`Match: ${p.w}`,given:mt[i]!=null?ps[mt[i]]?.d:'—',correct:p.d}]:[]);
    resolveWritten(mission,kind,score,ps.length,wrong);
  }
}

/* ═══════════════════════════ ORAL MISSIONS ═══════════════════════════ */
function pickPair(){
  const n=S.g.p.length;
  if(n<=1)return[0];
  const idxs=S.g.p.map((_,i)=>i);
  idxs.sort((a,b)=>(S.presentCount[a]-S.presentCount[b])||(Math.random()-.5));
  const chosen=[idxs[0],idxs[1]];
  chosen.forEach(i=>S.presentCount[i]++);
  return chosen;
}
function startOral(mission){
  goOralAttempt(mission,(S.att[mission]||1)-1);
}
function goOralAttempt(mission,attIdx,banner){
  const content=mission==='m3'?SIT[attIdx]:REP[attIdx];

  go('oex',{mission,attIdx,content,isRep:mission==='m5',step:'card',pair,_banner:banner});
}
function resolveOral(mission,grade){
  const att=S.att[mission];
  let passed,ptsDelta;
  if(att===1){passed=grade>=9;ptsDelta=passed?50:-10;}
  else if(att===2){passed=grade>=8;ptsDelta=passed?30:-15;}
  else{passed=grade>=8;ptsDelta=grade*2;}
  S.pts=S.pts+ptsDelta;
  S.res[mission+'-t'+att]={grade,success:passed,pts:ptsDelta};
  if(passed||att===3||(mission==='m5'&&att===2)){
    if(mission==='m3')go('m3d');else go('m5d');
  }else{
    S.att[mission]=att+1;
    goOralAttempt(mission,att);
  }
}

/* ═══════════════════════════ VICTORY ═══════════════════════════ */
function vVictory(){

  <div class="glass" style="background:linear-gradient(135deg,var(--teal),var(--coral));border-radius:18px;padding:28px;text-align:center;color:#fff;margin-bottom:16px;print-color-adjust:exact;-webkit-print-color-adjust:exact">
    <div class="pop" style="font-size:1.6rem;margin-bottom:4px">🛒 The Grand Store</div>
    <div style="opacity:.85;font-size:.88rem">English Escape Game — Bac Pro 1ère Commerce</div>
    <div style="opacity:.7;font-size:.78rem;margin-top:4px">${new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'})}</div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
    <div class="card" style="text-align:center;border-top:3px solid var(--teal)"><div style="font-weight:800;font-size:1rem;color:var(--teal)">${S.g.n}</div><div style="color:#888;font-size:.78rem;margin-top:3px">Équipe</div><div style="margin-top:7px">${parts}</div></div>
    <div class="card" style="text-align:center;border-top:3px solid var(--coral)"><div class="pop" style="font-size:1.9rem;color:var(--teal)">${S.pts}</div><div style="color:#888;font-size:.78rem">Points • ${dur}</div><div style="margin-top:6px">${stars(starRating(S.pts,250).s)}</div></div>
  </div>
  <div class="card"><div class="pop" style="color:var(--teal);margin-bottom:12px">🎯 Résultats par mission</div>
    <table style="width:100%;border-collapse:collapse"><tr style="background:var(--tl)"><th style="padding:9px;text-align:left;font-size:.8rem;font-weight:800">Mission</th><th style="padding:9px;text-align:left;font-size:.8rem;font-weight:800">Résultat</th><th style="padding:9px;text-align:left;font-size:.8rem;font-weight:800">Score</th><th style="padding:9px;text-align:left;font-size:.8rem;font-weight:800">Points</th></tr>${rows}</table>

  <div style="text-align:center;color:#BBB;font-size:.76rem">Créé par C. Iemfre • The Grand Store — English Escape Game Bac Pro Accueil</div>

}

/* ═══════════════ SAUVEGARDE LOCALE (localStorage, appareil de l'élève) ═══════════════ */
const SK='grandstore_v2_group_';
const SF=['g','pts','sh','rv','res','wr','t0','t1','np','att','sets1','sets4','sets5','presentCount','wordFor','m6'];
const NOSAVE=['home','rules','rgpd','tlg','tdb','slg','grp'];
const norm=n=>(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function safeScr(sc,e){sc=sc||S.scr;e=e||E;if(sc==='wex'||sc==='oex')return((e&&e.mission)||'m1')+'i';if(sc==='rep')return S.lastSafe||'fin';return sc;}
function toast(){try{let t=document.getElementById('svt');if(!t){t=document.createElement('div');t.id='svt';t.className='noprint';t.style.cssText='position:fixed;bottom:64px;right:16px;z-index:60;background:#43A047;color:#fff;padding:7px 14px;border-radius:50px;font-weight:800;font-size:.8rem;box-shadow:0 3px 10px rgba(0,0,0,.2);transition:opacity .4s;opacity:0;pointer-events:none';t.textContent='💾 Sauvegardé';document.body.appendChild(t);}t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.opacity='0';},1200);}catch(e){}}
function saveGame(flash){try{if(!S.g||!S.g.n||!S.t0||NOSAVE.includes(S.scr))return;const d={scr:safeScr()};SF.forEach(f=>{d[f]=S[f];});localStorage.setItem(SK+norm(S.g.n),JSON.stringify(d));if(flash)toast();}catch(e){}}
function listSaves(){const r=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(SK)===0){const d=JSON.parse(localStorage.getItem(k));if(d&&d.g)r.push({k,d});}}}catch(e){}return r;}
function checkSave(){const el=document.getElementById('svb');if(!el)return;let d=null;try{const raw=norm(F.gn)?localStorage.getItem(SK+norm(F.gn)):null;if(raw)d=JSON.parse(raw);}catch(e){}
  el.innerHTML=d?`<div class="ok" style="margin-bottom:12px">💾 Sauvegarde trouvée : <strong>${esc(d.g.n)}</strong> (${d.g.p.map(p=>esc(p.fn)+'-'+esc(p.ln)).join(', ')}) • ⭐ ${d.pts} pts<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn btn-green sm" onclick="resumeGame()">▶ Reprendre</button><button class="btn btn-red sm" onclick="resetSave()">🆕 Recommencer à zéro</button></div></div>`:'';}
function pickSave(i){const x=(F._l||[])[i];if(!x)return;F.gn=x.d.g.n;const g=document.getElementById('gn');if(g)g.value=F.gn;checkSave();}
function resumeGame(){try{const d=JSON.parse(localStorage.getItem(SK+norm(F.gn)));SF.forEach(f=>{if(d[f]!==undefined)S[f]=d[f];});F={};go(d.scr||'m1i');}catch(e){}}
function resetSave(){try{localStorage.removeItem(SK+norm(F.gn));}catch(e){}checkSave();}
window.addEventListener('pagehide',()=>saveGame());
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame();});

/* ═══════════════════════════ ROUTER ═══════════════════════════ */
function go(scr,ei={}){if(scr==='rep')S.lastSafe=safeScr();E=ei;S.scr=scr;render();saveGame(true);window.scrollTo(0,0);}
function render(){document.getElementById('app').innerHTML=view()+profFab()+scoreBadge()+reportFab();if(S.scr==='grp')checkSave();saveGame();}
function view(){
  const sc=S.scr;
  if(sc==='home')return vHome();
  if(sc==='rules')return vRules();
  if(sc==='rgpd')return vRGPD();
  if(sc==='tlg')return vLogin('Interface Professeur','tdb');
  if(sc==='tdb')return vTeacher();
  if(sc==='slg')return vLogin('Connexion Équipe','grp');
  if(sc==='grp')return vGroup();

  const W=hdr;
  /* Mission 1 — Induction Room (QCM) */
  if(sc==='m1i')return W(1)+`<div class="page">${lvlIntro('📋','Mission 1 — Induction Room','Vocabulaire de l\'accueil','<p style="font-weight:700;margin-bottom:7px">Welcome to The Grand Store!</p><p style="font-size:.88rem;color:#555;line-height:1.7">Avant d\'ouvrir le magasin, prouvez que vous maîtrisez le vocabulaire essentiel de la vente. 20 questions. Seuil de réussite : ≥ 16/20. 3 tentatives possibles, aucun blocage.</p>',"startWritten('m1','qcm')",'teal')}</div>`;
  if(sc==='wex'&&E.mission==='m1')return W(1)+`<div class="page">${E._banner||''}<div class="card card-teal"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><span style="background:var(--teal);color:#fff;padding:3px 12px;border-radius:50px;font-weight:800;font-size:.8rem">Tentative ${S.att.m1}</span><strong style="font-size:.95rem">QCM — Vocabulaire du commerce</strong></div>${vQCM()}</div></div>`;
  if(sc==='m1d')return W(1)+`<div class="page">${indiceScreen('m1',"go('m2i')")}</div>`;

  /* Mission 2 — Intelligence Desk (VF) */
  if(sc==='m2i')return W(2)+`<div class="page">${lvlIntro('🔍','Mission 2 — Intelligence Desk','Compréhension écrite','<p style="font-weight:700;margin-bottom:7px">A crisis file has just arrived!</p><p style="font-size:.88rem;color:#555;line-height:1.7">Lisez le texte professionnel puis répondez aux 8 affirmations Vrai/Faux. Seuil : ≥ 80% à la 1ère tentative, ≥ 70% à la 2e. 3 tentatives possibles, aucun blocage.</p>',"startWritten('m2','vf')",'coral')}</div>`;
  if(sc==='wex'&&E.mission==='m2')return W(2)+`<div class="page">${E._banner||''}<div class="card card-coral"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><span style="background:var(--coral);color:#fff;padding:3px 12px;border-radius:50px;font-weight:800;font-size:.8rem">Tentative ${S.att.m2}</span><strong style="font-size:.95rem">Vrai / Faux</strong></div>${vVF()}</div></div>`;
  if(sc==='m2d')return W(2)+`<div class="page">${indiceScreen('m2',"go('m3i')")}</div>`;

  /* Mission 3 — Situation Room (Oral) */
  if(sc==='m3i')return W(3)+`<div class="page">${lvlIntro('🎤','Mission 3 — Situation Room','Expression orale','<p style="font-weight:700;margin-bottom:7px">A live situation at the reception desk!</p><p style="font-size:.88rem;color:#555;line-height:1.7">Deux élèves sont tirés au sort. Ils lisent la carte de situation et gèrent l\'interaction en anglais. <strong>Mots-clés seulement, 8 maximum par élève, aucune phrase apprise.</strong></p>',"startOral('m3')",'teal')}</div>`;
  if(sc==='oex'&&E.mission==='m3')return W(3)+`<div class="page">${vOral()}</div>`;
  if(sc==='m3d')return W(3)+`<div class="page">${indiceScreen('m3',"go('m4i')")}</div>`;

  /* Mission 4 — Briefing Room (Matching) */
  if(sc==='m4i')return W(4)+`<div class="page">${lvlIntro('📌',"Mission 4 — Briefing Room",'Correspondance commerciale','<p style="font-weight:700;margin-bottom:7px">The price tags are all mixed up!</p><p style="font-size:.88rem;color:#555;line-height:1.7">Associez chaque mot anglais à sa traduction française. Seuil : ≥ 16/20. 3 tentatives possibles, aucun blocage.</p><p style="color:var(--red);font-weight:700;font-size:.84rem;margin-top:8px">⚠️ Lisez bien tous les mots et toutes les définitions AVANT de commencer : une fois qu\'une association est validée, il est impossible de revenir en arrière ou de la corriger !</p>',"startWritten('m4','match')",'teal')}</div>`;
  if(sc==='wex'&&E.mission==='m4')return W(4)+`<div class="page">${E._banner||''}<div class="card card-teal"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><span style="background:#7B1FA2;color:#fff;padding:3px 12px;border-radius:50px;font-weight:800;font-size:.8rem">Tentative ${S.att.m4}</span><strong style="font-size:.95rem">Correspondance — English / Français</strong></div>${vMatch()}</div></div>`;
  if(sc==='m4d')return W(4)+`<div class="page">${indiceScreen('m4',"go('m5i')")}</div>`;

  /* Mission 5 — Manager's Office (Oral report) */
  if(sc==='m5i')return W(5)+`<div class="page">${lvlIntro('📊',"Mission 5 — Manager's Office",'Phrases du vendeur','<p style="font-weight:700;margin-bottom:7px">Final mission — the manager checks your sales phrases!</p><p style="font-size:.88rem;color:#555;line-height:1.7">Associez chaque phrase française à son équivalent anglais. 20 paires. Seuil : ≥ 16/20. <strong>2 tentatives</strong>, avec de nouvelles phrases la deuxième fois. Pas d\'oral dans cette mission.</p><p style="color:var(--red);font-weight:700;font-size:.84rem;margin-top:8px">⚠️ Lisez bien toutes les phrases avant de commencer : une fois qu\'une association est validée, il est impossible de la corriger !</p>',"startWritten('m5','match')",'coral')}</div>`;
  if(sc==='wex'&&E.mission==='m5')return W(5)+`<div class="page">${E._banner||''}<div class="card card-coral"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><span style="background:var(--coral);color:#fff;padding:3px 12px;border-radius:50px;font-weight:800;font-size:.8rem">Tentative ${S.att.m5}/2</span><strong style="font-size:.95rem">Correspondance — Phrases du vendeur FR → EN</strong></div>${vMatch()}</div></div>`;
  if(sc==='m5d')return W(5)+`<div class="page">${indiceScreen('m5',"go('fin')")}</div>`;

  if(sc==='fin')return W(5)+`<div class="page">${vFinal()}</div>`;
  if(sc==='vic')return W(5)+`<div class="page">${vVictory()}</div>`;
  if(sc==='m6')return W(5)+`<div class="page">${vM6()}</div>`;
  if(sc==='rep')return vReport();
  return'<p>Écran inconnu</p>';
}
render();
</script></body></html>
